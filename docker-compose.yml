services:
  mongodb:
    # MongoDB 8 refuses to start on Linux 6.19–7.0.13 (this machine is 7.0.0).
    # 7.0 is the supported line on this kernel.
    image: mongo:7.0
    container_name: tcglib-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-tcglib}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-tcglib}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-tcglib}
    volumes:
      - tcglib_mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  tcglib_mongo_data:
